[project]
name = "xinliceping-backend"
# 版本号不在这里写字面量：唯一出处是 `app/version.py` 的 `__version__`
# （见 `[tool.setuptools.dynamic]`）。多一处字面量就多一次静默漂移的机会 ——
# 这个仓库此前正是这样：pyproject 写 0.1.0，而 `/openapi.json` 的 0.1.0
# 只是 FastAPI 的默认值，两个数字撞号纯属巧合，改一个不会带动另一个。
dynamic = ["version"]
description = "心晴中学生心理测评与关怀平台后端"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "bcrypt>=4.1.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.4.0",
  "PyJWT>=2.8.0",
  "pymysql>=1.1.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  # `deploy/build_package.py` 用它读 wheel 的 METADATA 做依赖闭环自检
  # （`make deploy-package` 走的是这个 venv）。它**不进** requirements.lock.txt：
  # 那是目标机的运行期依赖，而这个是打包工具的依赖，跑在开发机上。
  "packaging>=24.0"
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

# 必须有这一节：上面 `dynamic = ["version"]` 靠它把版本号取回来。
# 指向 `app/version.py` 里那个字面量，所以 setuptools 是**静态读**它
# （`app/version.py` 因此不许有任何 import）。
#
# 这里刻意**不加 `[build-system]`**：一旦声明，pip 就会走构建隔离、去网上
# 取一份 setuptools，`make install` 从此需要网络。不声明时 pip 用装好的
# 那一份（本机 65.5.0，`tool.setuptools.dynamic` 要 >= 61）。
[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}
